name: VoxTexto - QA leve e estudo de caso

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

permissions:
  contents: read

jobs:
  recruiting-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Instalar somente dependências leves para API e Word
        run: python -m pip install Flask==3.1.0 python-docx==1.1.2
      - name: Rodar testes de integração em diretórios temporários
        run: python -m unittest discover -s tests -v
      - name: Conferir versão do aplicativo/instalador
        run: python scripts/validate_release.py
